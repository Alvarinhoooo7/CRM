<!doctype html><html lang="es"><head><base target="_top"><meta charset="utf-8"><style>body{font:16px Arial;padding:20px;color:#17365d}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:8px}pre{white-space:pre-wrap;background:#f1f5f9;padding:12px}button{cursor:pointer}</style></head><body>
<label>Comuna <select id="destino"></select></label><label>Equipos <input id="equipos" type="number" min="1"></label><label>Fecha <input id="fecha" type="date"></label><label>Técnicos <input id="tecnicos" type="number" min="1"></label>
<button id="simular" onclick="simular()">Simular</button> <button id="confirmar" onclick="confirmar()" disabled>Confirmar creación</button><pre id="resultado" aria-live="polite">Cargando destinos…</pre>
<script>
var propuesta=null,entrada=null,solicitud=crypto.randomUUID();
function mostrar(texto){document.getElementById('resultado').textContent=texto;}
function error(e){mostrar(e.message||String(e));document.getElementById('simular').disabled=false;document.getElementById('confirmar').disabled=true;}
google.script.run.withFailureHandler(error).withSuccessHandler(function(d){d.destinos.forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.nombre;document.getElementById('destino').appendChild(o);});document.getElementById('tecnicos').value=d.tecnicos;mostrar('Complete las entradas y simule.');}).datosFormularioAgenda();
function simular(){entrada={solicitud:solicitud};['destino','equipos','fecha','tecnicos'].forEach(function(k){entrada[k]=document.getElementById(k).value;});document.getElementById('simular').disabled=true;document.getElementById('confirmar').disabled=true;google.script.run.withFailureHandler(error).withSuccessHandler(function(r){propuesta=r;mostrar('Horas: '+r.horas.toFixed(2)+'\nBase: $'+Math.round(r.subtotal).toLocaleString('es-CL')+'\nHotel: $'+Math.round(r.hotel).toLocaleString('es-CL')+'\nAnticipo del trabajo: $'+r.anticipoTrabajo.toLocaleString('es-CL')+'\nCosto operación: $'+Math.round(r.costoOperacion).toLocaleString('es-CL')+'\nItinerario:\n'+r.dias.map(function(d){return d.fecha+' · '+d.equipos+' equipos · '+d.horas.toFixed(2)+' h · '+d.noches+' noche(s)';}).join('\n')+'\nTécnicos: '+r.tecnicos.join(', ')+'\nVehículo: '+r.vehiculo+'\n'+(r.motivo||'Disponible para confirmar')+'\n'+r.nota);document.getElementById('simular').disabled=false;document.getElementById('confirmar').disabled=!r.confirmable;}).simularTrabajoNuevo(entrada);}
function confirmar(){document.getElementById('confirmar').disabled=true;entrada.propuesta=propuesta;google.script.run.withFailureHandler(error).withSuccessHandler(function(r){mostrar('Órdenes creadas: '+r.ordenes.join(', '));propuesta=null;solicitud=crypto.randomUUID();}).confirmarTrabajoNuevo(entrada);}
document.querySelectorAll('input,select').forEach(function(e){e.addEventListener('change',function(){propuesta=null;document.getElementById('confirmar').disabled=true;});});
</script></body></html>

<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light; --ink:#172b4d; --muted:#5e6c84; --line:#dfe1e6; --blue:#0052cc; --bg:#f4f5f7; --ok:#0b875b; --warn:#a15c00; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Arial,sans-serif; }
    header { color:#fff; padding:24px max(20px,calc((100% - 1200px)/2)); background:linear-gradient(120deg,#0747a6,#0052cc); display:flex; justify-content:space-between; gap:16px; align-items:center; }
    h1 { margin:0; font-size:24px; } h2 { margin:0 0 14px; font-size:17px; } .sub { opacity:.82; margin:4px 0 0; }
    button { border:0; border-radius:5px; padding:9px 13px; cursor:pointer; color:#0747a6; background:#fff; font-weight:bold; }
    main { max-width:1200px; margin:22px auto; padding:0 20px 28px; } .status { color:var(--muted); min-height:20px; margin-bottom:12px; }
    .cards { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:12px; margin-bottom:18px; } .card,.panel { background:#fff; border:1px solid var(--line); border-radius:7px; box-shadow:0 1px 2px #091e4226; }
    .card { padding:15px; } .card .label { color:var(--muted); font-size:12px; } .card .value { font-size:25px; font-weight:bold; margin-top:5px; } .positive { color:var(--ok); } .negative { color:#bf2600; }
    .layout { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; margin-bottom:18px; } .panel { padding:17px; overflow:auto; } table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:9px 7px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); font-size:11px; text-transform:uppercase; } .pill { display:inline-block; border-radius:12px; background:#deebff; color:#0747a6; padding:2px 7px; font-size:12px; } .empty { color:var(--muted); font-style:italic; }
    .calendar { min-width:720px; } .calendar td { min-width:125px; font-size:12px; } .calendar td small { color:var(--muted); display:block; } .bar { height:9px; background:#dfe1e6; border-radius:5px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--blue); }
    @media(max-width:800px) { header { padding:18px; } main { padding:0 12px; } .cards { grid-template-columns:repeat(2,1fr); } .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>CRM Servicio Técnico en Ruta</h1><p class="sub" id="subtitle">Cargando planificación…</p></div>
    <button type="button" onclick="cargar()">Actualizar</button>
  </header>
  <main>
    <div class="status" id="status" aria-live="polite"></div>
    <section class="cards" id="cards"></section>
    <section class="layout">
      <div class="panel"><h2>Estado de órdenes de trabajo</h2><div id="estados"></div></div>
      <div class="panel"><h2>Transporte planificado</h2><div id="transportes"></div></div>
    </section>
    <section class="panel"><h2>Disponibilidad semanal</h2><div id="calendario"></div></section>
    <section class="layout">
      <div class="panel"><h2>Desempeño por técnico</h2><div id="tecnicos"></div></div>
      <div class="panel"><h2>Rentabilidad por destino</h2><div id="rentabilidad"></div></div>
    </section>
  </main>
  <script>
    const money = value => new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(value)||0);
    const number = value => new Intl.NumberFormat('es-CL',{maximumFractionDigits:1}).format(Number(value)||0);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const empty = text => '<p class="empty">'+escapeHtml(text)+'</p>';
    function setStatus(text, error) { const node=document.getElementById('status'); node.textContent=text||''; node.style.color=error?'#bf2600':''; }
    function renderDashboard(data, calendar) {
      const r=data.resumen || {}; document.getElementById('subtitle').textContent='Semana '+data.semana+' · información de la última planificación';
      const cards=[['OT planificadas',r.ot],['Equipos',r.equipos],['Horas de servicio',number(r.horasServicio)+' h'],['Margen',money(r.margen)],['Viáticos',money(r.viaticos)]];
      document.getElementById('cards').innerHTML=cards.map(c=>'<article class="card"><div class="label">'+c[0]+'</div><div class="value">'+c[1]+'</div></article>').join('');
      document.getElementById('estados').innerHTML=(data.estadosOT||[]).length ? '<table><thead><tr><th>Estado</th><th>Órdenes</th></tr></thead><tbody>'+data.estadosOT.map(x=>'<tr><td><span class="pill">'+escapeHtml(x.estado)+'</span></td><td>'+number(x.cantidad)+'</td></tr>').join('')+'</tbody></table>' : empty('Aún no hay órdenes para esta semana.');
      document.getElementById('transportes').innerHTML=(data.modosTransporte||[]).length ? '<table><thead><tr><th>Modo</th><th>Tramos</th><th>Km</th><th>Costo</th></tr></thead><tbody>'+data.modosTransporte.map(x=>'<tr><td>'+escapeHtml(x.modo)+'</td><td>'+number(x.tramos)+'</td><td>'+number(x.km)+'</td><td>'+money(x.costo)+'</td></tr>').join('')+'</tbody></table>' : empty('No hay traslados planificados.');
      const people=(data.tecnicos||[]).slice().sort((a,b)=>Number(b.HORAS_TOTALES)-Number(a.HORAS_TOTALES));
      document.getElementById('tecnicos').innerHTML=people.length ? '<table><thead><tr><th>Técnico</th><th>Horas</th><th>Utilización</th><th>Margen</th></tr></thead><tbody>'+people.map(x=>'<tr><td>'+escapeHtml(x.NOMBRE)+'</td><td>'+number(x.HORAS_TOTALES)+' h<div class="bar"><i style="width:'+Math.min(100,Number(x.PCT_UTILIZACION||0)*100)+'%"></i></div></td><td>'+number(Number(x.PCT_UTILIZACION||0)*100)+'%</td><td class="'+(Number(x.MARGEN_CLP)>=0?'positive':'negative')+'">'+money(x.MARGEN_CLP)+'</td></tr>').join('')+'</tbody></table>' : empty('Los KPI aparecen después de planificar.');
      const profit=(data.rentabilidad||[]).slice().sort((a,b)=>Number(a.MARGEN_PCT)-Number(b.MARGEN_PCT));
      document.getElementById('rentabilidad').innerHTML=profit.length ? '<table><thead><tr><th>Destino</th><th>Margen</th><th>Resultado</th></tr></thead><tbody>'+profit.map(x=>'<tr><td>'+escapeHtml(x.COMUNA)+'</td><td class="'+(Number(x.MARGEN_CLP)>=0?'positive':'negative')+'">'+money(x.MARGEN_CLP)+'<br><small>'+number(Number(x.MARGEN_PCT)*100)+'%</small></td><td>'+escapeHtml(x.VEREDICTO)+'</td></tr>').join('')+'</tbody></table>' : empty('No hay análisis de rentabilidad disponible.');
      const days=(calendar&&calendar.dias)||[]; const rows=(calendar&&calendar.tecnicos)||[];
      document.getElementById('calendario').innerHTML=rows.length ? '<table class="calendar"><thead><tr><th>Técnico</th>'+days.map(d=>'<th>'+escapeHtml(d.etiqueta)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(t=>'<tr><td><strong>'+escapeHtml(t.nombre)+'</strong><br><small>'+number(t.totalHoras)+' h</small></td>'+t.celdas.map(c=>'<td><span class="pill">'+escapeHtml(c.estado)+'</span><br>'+number(c.horas)+' h<small>'+escapeHtml(c.detalle||'Disponible en base')+'</small></td>').join('')+'</tr>').join('')+'</tbody></table>' : empty('No existe un calendario para la semana seleccionada.');
      setStatus('Actualizado correctamente.');
    }
    function cargar() { setStatus('Actualizando…'); google.script.run.withSuccessHandler(data=>google.script.run.withSuccessHandler(cal=>renderDashboard(data,cal)).withFailureHandler(showError).apiCalendario(data.semana)).withFailureHandler(showError).apiDashboard(); }
    function showError(error) { setStatus('No se pudo cargar el panel: '+(error.message||error),true); }
    cargar();
  </script>
</body>
</html>

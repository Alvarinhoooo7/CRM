<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --blue:#0052cc; --ink:#172b4d; --muted:#5e6c84; --line:#dfe1e6; --bg:#f4f5f7; } * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--bg); font:15px/1.45 Arial,sans-serif; } header { background:#0052cc; color:white; padding:20px; } h1 { margin:0; font-size:22px; } main { max-width:760px; margin:0 auto; padding:16px; } select,button { font:inherit; padding:9px; border-radius:5px; border:1px solid var(--line); } button { color:white; border-color:var(--blue); background:var(--blue); cursor:pointer; } .toolbar { display:flex; gap:8px; margin-bottom:16px; } select { flex:1; } .card { background:white; border:1px solid var(--line); border-radius:7px; padding:15px; margin-bottom:12px; box-shadow:0 1px 2px #091e4226; } h2 { font-size:17px; margin:0 0 8px; } .muted { color:var(--muted); } .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .metric { background:#deebff; border-radius:5px; padding:10px; } .metric strong { font-size:19px; display:block; } .ot { border-left:4px solid var(--blue); padding:10px; margin:9px 0; background:#f7f9fc; } a { color:var(--blue); } #status { min-height:21px; color:var(--muted); } @media(max-width:500px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><h1>Mi ruta</h1><div id="subtitle">Consulta de planificación</div></header>
  <main>
    <div class="toolbar"><select id="tecnico" aria-label="Técnico"></select><button type="button" onclick="cargarPanel()">Ver ruta</button></div>
    <div id="status" aria-live="polite">Cargando técnicos…</div><div id="panel"></div>
  </main>
  <script>
    const initial = <?!= JSON.stringify(tecnicoInicial) ?>;
    const money = n => new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n)||0);
    const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function status(t,error) { const e=document.getElementById('status'); e.textContent=t; e.style.color=error?'#bf2600':''; }
    function loadTechnicians(list) { const select=document.getElementById('tecnico'); select.innerHTML=list.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.nombre)+' · '+esc(t.cargo)+'</option>').join(''); if(initial && list.some(t=>t.id===initial)) select.value=initial; status(''); cargarPanel(); }
    function cargarPanel() { const id=document.getElementById('tecnico').value; if(!id) return; status('Cargando ruta…'); google.script.run.withSuccessHandler(render).withFailureHandler(e=>status('No se pudo cargar la ruta: '+(e.message||e),true)).apiPanelTecnico(id); }
    function render(d) { if(d.error) { status(d.error,true); return; } const p=d.perfil||{}; document.getElementById('subtitle').textContent=(p.nombre||'Técnico')+' · '+(d.fecha||''); const ot=d.otHoy||[]; const v=d.viatico; const checklist=d.materiales;
      document.getElementById('panel').innerHTML='<section class="card"><h2>'+esc(p.nombre)+'</h2><p class="muted">'+esc(p.cargo||'')+' · '+esc(p.especialidad||'')+'</p><div class="grid"><div class="metric"><strong>'+Number((d.horas||{}).semana||0).toFixed(1)+' h</strong>Semana</div><div class="metric"><strong>'+Number((d.horas||{}).holgura||0).toFixed(1)+' h</strong>Holgura legal</div><div class="metric"><strong>'+ot.length+'</strong>OT hoy</div></div></section>'+
        '<section class="card"><h2>Servicios de hoy</h2>'+(ot.length?ot.map(o=>'<article class="ot"><strong>'+esc(o.desde)+'–'+esc(o.hasta)+' · '+esc(o.comuna)+'</strong><br>'+esc(o.equipos)+' equipo(s) · '+esc(o.estado)+'<br><a href="'+esc(o.mapa)+'" target="_blank">Abrir ubicación</a></article>').join(''):'<p class="muted">No hay servicios planificados para hoy.</p>')+'</section>'+
        (d.cuadrilla?'<section class="card"><h2>Despacho</h2><p><strong>'+esc(d.cuadrilla.nombre)+'</strong><br>'+esc(d.cuadrilla.modo)+' · compañeros: '+esc(d.cuadrilla.companeros)+'</p>'+(d.vehiculo?'<p class="muted">Vehículo: '+esc(d.vehiculo.modelo)+' · '+esc(d.vehiculo.patente)+'</p>':'')+'</section>':'')+
        (v?'<section class="card"><h2>Viático</h2><div class="grid"><div class="metric"><strong>'+money(v.total)+'</strong>Transferido</div><div class="metric"><strong>'+money(v.rendido)+'</strong>Rendido</div><div class="metric"><strong>'+money(v.saldo)+'</strong>Saldo</div></div></section>':'')+
        (checklist?'<section class="card"><h2>Checklist de carga</h2><p class="muted">'+esc(checklist.vehiculo)+' · '+esc(checklist.pesoTotalKg)+' kg'+(checklist.excedeCapacidad?' · EXCEDE CAPACIDAD':'')+'</p><ul>'+checklist.items.map(i=>'<li>'+esc(i.item)+': '+esc(i.cantidad)+' '+esc(i.unidad)+(i.cargado?' ✓':'')+'</li>').join('')+'</ul></section>':''); status(''); }
    google.script.run.withSuccessHandler(loadTechnicians).withFailureHandler(e=>status('No se pudieron cargar técnicos: '+(e.message||e),true)).apiTecnicos();
  </script>
</body>
</html>

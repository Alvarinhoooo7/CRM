/** Inserta la tarjeta explicativa al inicio de una vista, una sola vez. */
function inyectarAyuda(vista) {
  var e = EXPLICACION_VISTA[vista];
  if (!e) return;

  var contenedor = document.getElementById('vista-' + vista);
  if (!contenedor || contenedor.querySelector('.ayuda-vista')) return;

  var caja = document.createElement('div');
  caja.className = 'tarjeta ayuda-vista';
  caja.innerHTML =
    '<div class="ayuda-cabecera">' +
      '<h2>¿Qué es esta pantalla?</h2>' +
      '<button class="btn btn-chico btn-secundario" onclick="alternarAyuda(this)">Ocultar</button>' +
    '</div>' +
    '<div class="ayuda-cuerpo">' +
      '<p class="ayuda-quees">' + e.quees + '</p>' +
      '<div class="ayuda-columnas">' +
        '<div><h3>Cómo leerlo</h3><ul>' +
          e.comoleerlo.map(function (x) { return '<li>' + x + '</li>'; }).join('') +
        '</ul></div>' +
        '<div><h3>Qué hacer con esto</h3><p>' + e.quehacer + '</p>' +
          (e.ojo ? '<div class="ayuda-ojo"><b>Ojo:</b> ' + e.ojo + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';

  contenedor.insertBefore(caja, contenedor.firstChild);
}

function alternarAyuda(boton) {
  var cuerpo = boton.closest('.ayuda-vista').querySelector('.ayuda-cuerpo');
  var oculto = cuerpo.style.display === 'none';
  cuerpo.style.display = oculto ? '' : 'none';
  boton.textContent = oculto ? 'Ocultar' : 'Mostrar explicación';
}

/** Arma el manual completo dentro de la pestaña Guía. */
function dibujarManual() {
  var destino = document.getElementById('manualCompleto');
  if (!destino) return;

  var html = '';

  // --- Como se calculan los tiempos ------------------------------------
  html += '<div class="tarjeta"><h2>Cómo se calculan los tiempos</h2>' +
          '<p class="ayuda">' + EXPLICACION_TIEMPOS.intro + '</p>';

  EXPLICACION_TIEMPOS.bloques.forEach(function (b) {
    html += '<div class="bloque-explica">' +
      '<h3>' + b.titulo + '</h3>' +
      '<div class="formula">' + b.formula + '</div>' +
      '<p>' + b.texto + '</p>' +
      (b.ejemplos.length
        ? '<ul class="ejemplos">' + b.ejemplos.map(function (x) {
            return '<li>' + x + '</li>'; }).join('') + '</ul>'
        : '') +
      '</div>';
  });
  html += '</div>';

  // --- Como se calcula la plata ----------------------------------------
  html += '<div class="tarjeta"><h2>Cómo se calcula cada peso</h2>' +
    '<div class="tabla-envoltorio"><table class="datos">' +
    '<tr><th>Concepto</th><th>Fórmula</th><th>Explicación</th></tr>' +
    EXPLICACION_COSTOS.map(function (c) {
      return '<tr><td><b>' + c.concepto + '</b></td>' +
        '<td class="chico"><code>' + c.formula + '</code></td>' +
        '<td class="chico">' + c.texto + '</td></tr>';
    }).join('') + '</table></div></div>';

  // --- Herramientas -----------------------------------------------------
  var h = EXPLICACION_HERRAMIENTAS;
  html += '<div class="tarjeta"><h2>' + h.titulo + '</h2>' +
    '<p>' + h.texto + '</p><ul class="ejemplos">' +
    h.consecuencias.map(function (x) { return '<li>' + x + '</li>'; }).join('') +
    '</ul></div>';

  // --- Glosario ----------------------------------------------------------
  html += '<div class="tarjeta"><h2>Glosario</h2>' +
    '<p class="ayuda">Cada palabra del sistema que podría no significar nada para alguien ' +
    'que lo abre por primera vez.</p>' +
    '<input type="search" id="buscarGlosario" placeholder="Buscar una palabra…" ' +
    'oninput="filtrarGlosario()" style="margin-bottom:14px">' +
    '<div id="listaGlosario">' +
    GLOSARIO.map(function (g) {
      return '<div class="termino" data-termino="' + g.termino.toLowerCase() + '">' +
        '<b>' + g.termino + '</b><p>' + g.texto + '</p></div>';
    }).join('') + '</div></div>';

  destino.innerHTML = html;
}

function filtrarGlosario() {
  var texto = (document.getElementById('buscarGlosario').value || '').toLowerCase();
  document.querySelectorAll('#listaGlosario .termino').forEach(function (el) {
    var coincide = !texto ||
      el.dataset.termino.indexOf(texto) !== -1 ||
      el.textContent.toLowerCase().indexOf(texto) !== -1;
    el.style.display = coincide ? '' : 'none';
  });
}
</script>

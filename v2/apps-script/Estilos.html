<style>
/* ==========================================================================
   SERVICIO TECNICO EN RUTA · v2 · Estilos.html
   Sobrio y profesional. Acento rojo institucional y azul.
   ========================================================================== */

:root {
  --primario: #1F3864;
  --acento: #C00000;
  --ok: #2E7D32;
  --tolerancia: #E8A33D;
  --sobretiempo: #1F3864;
  --fondo: #F4F5F7;
  --tarjeta: #FFFFFF;
  --borde: #E1E4E8;
  --texto: #1E2430;
  --tenue: #6B7280;
  --sombra: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
  --sombra-alta: 0 4px 12px rgba(16,24,40,.10);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 14px;
  color: var(--texto);
  background: var(--fondo);
  -webkit-font-smoothing: antialiased;
}

/* --- Ingreso ------------------------------------------------------------ */
.pantalla-login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1F3864 0%, #2E4F8F 100%);
  padding: 20px;
}
.caja-login {
  background: #fff; border-radius: 10px; box-shadow: var(--sombra-alta);
  padding: 36px 32px; width: 100%; max-width: 380px;
}
.caja-login h1 { margin: 0 0 4px; font-size: 20px; color: var(--primario); }
.caja-login .sub { color: var(--tenue); font-size: 13px; margin-bottom: 24px; }
.campo { margin-bottom: 14px; }
.campo label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--tenue); margin-bottom: 5px;
}
.campo input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--borde);
  border-radius: 6px; font-size: 14px; font-family: inherit;
}
.campo input:focus { outline: 2px solid var(--primario); outline-offset: -1px; }

/* --- Botones ------------------------------------------------------------ */
.btn {
  background: var(--primario); color: #fff; border: 0; border-radius: 6px;
  padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: filter .15s;
}
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-ancho { width: 100%; }
.btn-secundario { background: #fff; color: var(--primario); border: 1px solid var(--borde); }
.btn-acento { background: var(--acento); }
.btn-chico { padding: 6px 12px; font-size: 12px; }

/* --- Estructura --------------------------------------------------------- */
.cabecera {
  background: var(--primario); color: #fff; padding: 12px 22px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.cabecera h1 { margin: 0; font-size: 16px; font-weight: 600; }
.cabecera .version { font-size: 11px; opacity: .7; }
.cabecera .espaciador { flex: 1; }
.cabecera .meta { font-size: 11px; opacity: .85; text-align: right; line-height: 1.5; }

.pestanas {
  background: #fff; border-bottom: 1px solid var(--borde);
  display: flex; gap: 2px; padding: 0 16px; overflow-x: auto;
}
.pestana {
  padding: 12px 16px; border: 0; background: none; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--tenue);
  border-bottom: 3px solid transparent; white-space: nowrap; font-family: inherit;
}
.pestana:hover { color: var(--texto); }
.pestana.activa { color: var(--primario); border-bottom-color: var(--acento); }

.contenido { padding: 22px; max-width: 1400px; margin: 0 auto; }
.vista { display: none; }
.vista.activa { display: block; }

/* --- Tarjetas ----------------------------------------------------------- */
.tarjeta {
  background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px;
  box-shadow: var(--sombra); padding: 18px; margin-bottom: 18px;
}
.tarjeta h2 {
  margin: 0 0 4px; font-size: 15px; color: var(--primario);
}
.tarjeta .ayuda { color: var(--tenue); font-size: 12px; margin: 0 0 14px; line-height: 1.5; }

.rejilla { display: grid; gap: 14px; }
.rejilla-2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.rejilla-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.rejilla-4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

/* --- KPI ---------------------------------------------------------------- */
.kpi {
  background: #fff; border: 1px solid var(--borde); border-radius: 8px;
  padding: 15px 17px; box-shadow: var(--sombra);
}
.kpi .etiqueta {
  font-size: 11px; color: var(--tenue); text-transform: uppercase;
  letter-spacing: .4px; font-weight: 600; margin-bottom: 6px;
}
.kpi .valor { font-size: 25px; font-weight: 700; color: var(--primario); line-height: 1.1; }
.kpi .valor.acento { color: var(--acento); }
.kpi .pie { font-size: 11px; color: var(--tenue); margin-top: 5px; }

/* --- Tablas ------------------------------------------------------------- */
.tabla-envoltorio { overflow-x: auto; }
table.datos { width: 100%; border-collapse: collapse; font-size: 13px; }
table.datos th {
  background: #F0F2F5; text-align: left; padding: 9px 11px;
  font-size: 11px; text-transform: uppercase; letter-spacing: .3px;
  color: var(--tenue); border-bottom: 2px solid var(--borde); white-space: nowrap;
}
table.datos th.orden { cursor: pointer; user-select: none; }
table.datos th.orden:hover { color: var(--primario); }
table.datos td { padding: 9px 11px; border-bottom: 1px solid #EEF0F3; }
table.datos tr:hover td { background: #FAFBFC; }
table.datos td.num, table.datos th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.datos td.c, table.datos th.c { text-align: center; }
.chico { font-size: 11px; color: var(--tenue); }

/* --- Estados ------------------------------------------------------------ */
.pastilla {
  display: inline-block; padding: 2px 9px; border-radius: 11px;
  font-size: 11px; font-weight: 700; letter-spacing: .2px;
}
.pastilla.ok { background: #E6F4EA; color: var(--ok); }
.pastilla.tolerancia { background: #FDF3E3; color: #9A6A16; }
.pastilla.sobretiempo { background: #E8EDF7; color: var(--primario); }
.pastilla.fuera { background: #FCE8E8; color: var(--acento); }
.pastilla.neutra { background: #EEF0F3; color: var(--tenue); }

/* --- Alertas ------------------------------------------------------------ */
.alerta {
  padding: 11px 14px; border-radius: 6px; margin-bottom: 9px;
  font-size: 13px; line-height: 1.55; border-left: 4px solid;
}
.alerta.error { background: #FCE8E8; border-color: var(--acento); color: #7A1212; }
.alerta.aviso { background: #FDF3E3; border-color: var(--tolerancia); color: #6B4A0F; }
.alerta.bien  { background: #E6F4EA; border-color: var(--ok); color: #1B5E20; }
.alerta .id {
  display: block; font-size: 10px; font-weight: 700;
  letter-spacing: .5px; opacity: .75; margin-bottom: 2px;
}

/* --- Hallazgos ---------------------------------------------------------- */
.hallazgo {
  background: #fff; border: 1px solid var(--borde); border-left: 4px solid var(--acento);
  border-radius: 6px; padding: 15px 17px; margin-bottom: 12px;
}
.hallazgo h3 { margin: 0 0 6px; font-size: 14px; color: var(--acento); }
.hallazgo p { margin: 0; font-size: 13px; line-height: 1.6; color: #3A4150; }

/* --- Matriz de calendario ----------------------------------------------- */
table.matriz { border-collapse: collapse; font-size: 12px; width: 100%; }
table.matriz th, table.matriz td {
  border: 1px solid var(--borde); padding: 6px 4px; text-align: center;
}
table.matriz th { background: #F0F2F5; font-size: 11px; }
table.matriz td.nombre { text-align: left; white-space: nowrap; font-weight: 600; }
.celda-ok { background: #E6F4EA; }
.celda-tol { background: #FDF3E3; }
.celda-sob { background: #E8EDF7; }
.celda-fue { background: #FCE8E8; font-weight: 700; }
.celda-vacia { background: #FAFBFC; color: #C5CAD2; }

/* --- Barras ------------------------------------------------------------- */
.barra-fondo {
  background: #EEF0F3; border-radius: 4px; height: 18px;
  overflow: hidden; position: relative; min-width: 110px;
}
.barra { height: 100%; background: var(--primario); border-radius: 4px; }
.barra.alta { background: var(--acento); }
.barra.media { background: var(--tolerancia); }
.barra.baja { background: var(--ok); }

/* --- Grafico ------------------------------------------------------------ */
.grafico { width: 100%; height: 300px; }

/* --- Formularios -------------------------------------------------------- */
.fila-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.fila-form .campo { margin-bottom: 0; flex: 1; min-width: 145px; }
select, input[type=number], input[type=text] {
  width: 100%; padding: 9px 11px; border: 1px solid var(--borde);
  border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff;
}

/* --- Cargando ----------------------------------------------------------- */
.cargando { text-align: center; padding: 50px 20px; color: var(--tenue); }
.girador {
  width: 34px; height: 34px; margin: 0 auto 14px;
  border: 3px solid var(--borde); border-top-color: var(--primario);
  border-radius: 50%; animation: girar .8s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }

/* --- Orden de servicio -------------------------------------------------- */
.checklist-item {
  padding: 7px 0; border-bottom: 1px dotted var(--borde);
  display: flex; gap: 10px; align-items: flex-start; font-size: 13px;
}
.checklist-item input { margin-top: 3px; }

/* --- Utilidades --------------------------------------------------------- */
.oculto { display: none !important; }
.error-caja {
  background: #FCE8E8; border: 1px solid #F5C6C6; border-radius: 6px;
  padding: 14px; color: #7A1212; font-size: 13px; line-height: 1.55;
}
.nota-fuente {
  font-size: 11px; color: var(--tenue); font-style: italic;
  margin-top: 10px; line-height: 1.5;
}

@media (max-width: 760px) {
  .contenido { padding: 14px; }
  .cabecera { padding: 10px 14px; }
  .cabecera .meta { text-align: left; }
}
/* Operación y edición: lectura cómoda en proyector, escritorio y móvil. */

a { color:#176478; text-underline-offset:3px; }
:focus-visible { outline:3px solid #b74a24; outline-offset:3px; }

.cabecera h1 { font-size:20px; letter-spacing:-.6px; }

.contenido { max-width:1560px; padding:24px 28px; }

.tarjeta h2 { font-size:18px; margin-bottom:10px; }
.tarjeta .ayuda { font-size:13px; }
.kpi { border-radius:12px; padding:22px; }
.kpi .valor { font-size:30px; letter-spacing:-1px; }
#kpis { margin-bottom:24px; }
.banda-contexto { display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:1px; color:var(--tenue); margin:0 0 22px; flex-wrap:wrap; }
.banda-contexto>span:last-child { margin-left:auto; letter-spacing:0; }
.punto-vivo { width:7px; height:7px; border-radius:50%; background:#368573; }
.intro-vista { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px; }
.intro-vista h2 { font-size:32px; letter-spacing:-1px; margin:4px 0; color:var(--primario); }
.intro-vista p { margin:4px 0; color:var(--tenue); }
.sobretitulo { font-size:11px; letter-spacing:2px; color:var(--acento); font-weight:700; }
.tarjeta-ruta { border-top:3px solid #368573; }
.tarjeta-ruta h3 { font-size:16px; margin:14px 0 8px; }
.vehiculo { padding:18px; background:#f6f8f7; border:1px solid var(--borde); border-radius:8px; }
.vehiculo p { margin:7px 0; }
.grafico { overflow:auto; }
.barras-accesibles { padding:8px 0; }
.fila-barra { display:grid; grid-template-columns:minmax(95px,1fr) minmax(55px,1fr) 85px; align-items:center; gap:10px; margin:8px 0; font-size:11px; }
.fila-barra .barra-fondo { min-width:0; height:10px; }.fila-barra b { text-align:right; }
.acciones-editor { display:flex; gap:10px; margin:18px 0; }
.editor-plan { min-width:1900px; }
.editor-plan input:not([type=checkbox]),.editor-plan select { min-width:85px; }
.editor-plan td:nth-child(6) select,.editor-plan td:nth-child(7) select { min-width:155px; }
.editor-plan input[type=checkbox] { width:20px; height:20px; accent-color:var(--primario); }
.parametro { display:grid; grid-template-columns:minmax(220px,1fr) 180px 90px; gap:18px; align-items:center; padding:18px 0; border-bottom:1px solid var(--borde); }
.parametro[hidden] { display:none; }
.parametro label { font-weight:600; }
details { border-bottom:1px solid var(--borde); padding:16px 0; }
summary { font-weight:600; cursor:pointer; color:var(--primario); }
input[type=search],.campo input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--borde); border-radius:6px; }
input:disabled,select:disabled { background:#eef1ef; color:#52646b; }
.pantalla-login { background:radial-gradient(ellipse at top right,#326c71,transparent 60%),#102d39; }
.caja-login { max-width:430px; padding:44px; border-radius:18px; }
.caja-login h1 { font-size:28px; line-height:1.15; letter-spacing:-1px; margin-bottom:14px; }
@media(max-width:760px) {
 .rejilla-2,.rejilla-3,.rejilla-4 { grid-template-columns:minmax(0,1fr); }
 .contenido { padding:16px; } .tarjeta { padding:18px; }
 .intro-vista { align-items:flex-start; flex-direction:column; }.intro-vista h2 { font-size:27px; }
 .parametro { grid-template-columns:minmax(0,1fr); gap:8px; }
 .banda-contexto>span:last-child { margin-left:0; }
 .cabecera .espaciador { display:none; }.cabecera h1 { width:100%; }
 .caja-login { padding:30px 24px; }.cabecera select { max-width:100%; }
}
@media print {
 body{background:white;color:black}.cabecera,.pestanas,.banda-contexto,.btn,#notificacion,#login{display:none!important}
 .contenido{max-width:none;padding:0}.tarjeta{box-shadow:none;break-inside:avoid}.tabla-envoltorio{overflow:visible}
}
</style>

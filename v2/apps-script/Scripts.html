<script>
/* ==========================================================================
   SERVICIO TECNICO EN RUTA · v2 · Scripts.html
   Javascript del navegador. Habla con el servidor por google.script.run.
   ========================================================================== */

var TOKEN = '';
var DATOS = null;
var SECUENCIA_TABLERO = 0;
var GRAFICOS_LISTOS = false;
var VISTA_INICIAL = document.body.dataset.vista || 'hoy';
var TECNICO_INICIAL = document.body.dataset.tecnico || '';

if (window.google && google.charts) {
  google.charts.load('current', { packages: ['corechart', 'bar'] });
  google.charts.setOnLoadCallback(function () { GRAFICOS_LISTOS = true; dibujarGraficos(); });
}

/* ==========================================================================
   FORMATO
   ========================================================================== */


/* --------------------------------------------------------------------------
   NOMBRES LEGIBLES
   Nadie que abra esta web por primera vez sabe que es D1, V3 o C2. Todo lo
   que se muestra en pantalla pasa por aqui y sale con nombre completo.
   -------------------------------------------------------------------------- */

/** T01 -> "Pepe Videla". Si no esta en la nomina, devuelve el codigo. */
function nomT(cod) {
  if (!DATOS || !DATOS.tecnicos || !cod) return cod || '';
  var t = DATOS.tecnicos.filter(function (x) { return x.codigo === cod; })[0];
  return t ? t.nombre : cod;
}

/** T01 -> "Pepe Videla (T01)". Para tablas donde el codigo todavia sirve. */
function nomTC(cod) {
  if (!cod) return '';
  var nombre = nomT(cod);
  return (nombre === cod) ? cod : nombre + ' (' + cod + ')';
}

/** V3 -> "Vehículo 3", agregando el modelo si esta cargado. */
function nomV(cod) {
  if (!cod || cod === '—') return '—';
  var numero = String(cod).replace(/\D/g, '');
  var etiqueta = 'Vehículo ' + (numero || cod);
  if (DATOS && DATOS.flota) {
    var v = DATOS.flota.filter(function (x) { return x.codigo === cod; })[0];
    if (v && v.patente) etiqueta += ' · ' + v.patente;
  }
  return etiqueta;
}

/** Alias historico: en el codigo viejo nomC se usaba para el vehiculo. */
function nomC(cod) { return nomV(cod); }

/** C2 -> "Cuadrilla 2". */
function nomCu(cod) {
  if (!cod) return '';
  var numero = String(cod).replace(/\D/g, '');
  return numero ? 'Cuadrilla ' + numero : cod;
}

/** D1 -> "Día 1". */
function fmtD(d) {
  if (!d) return '';
  var numero = String(d).replace(/\D/g, '');
  return numero ? 'Día ' + numero : d;
}

/** "T01,T02" -> "Pepe Videla, Pepa Videla". */
function fmtC(txt) {
  if (!txt) return '';
  if (Object.prototype.toString.call(txt) === '[object Array]') {
    return txt.map(function (c) { return nomT(String(c).trim()); }).join(', ');
  }
  return String(txt).split(',').map(function (c) {
    return nomT(c.trim()); }).join(', ');
}

/**
 * Traduce los codigos que vienen en los mensajes del servidor.
 * Las alertas se escriben con C1, D4 y T07 porque asi estan en la planilla,
 * pero quien lee la pantalla necesita "Cuadrilla 1", "Día 4" y el nombre.
 */
function humanizar(texto) {
  if (!texto) return '';
  return String(texto)
    // Los limites de palabra evitan romper textos como RUTA_5S o IVA12.
    .replace(/\bT(\d{2,3})\b/g, function (cod) { return nomT(cod); })
    .replace(/\bC(\d+)\b/g, function (cod, n) { return 'Cuadrilla ' + n; })
    .replace(/\bD(\d+)\b/g, function (cod, n) { return 'Día ' + n; })
    .replace(/\bV(\d+)\b/g, function (cod, n) { return 'Vehículo ' + n; });
}

function pesos(n) {
  if (n === null || n === undefined || n === 'no ejecutable') return '—';
  return '$' + Math.round(n).toLocaleString('es-CL');
}
function numero(n, dec) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString('es-CL',
    { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
}
function porciento(n) { return Math.round((n || 0) * 100) + '%'; }
function escapar(t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function claseEstado(estado) {
  if (estado === 'OK') return 'ok';
  if (estado === 'TOLERANCIA') return 'tolerancia';
  if (estado === 'SOBRETIEMPO') return 'sobretiempo';
  return 'fuera';
}

/* ==========================================================================
   SESION
   ========================================================================== */

function entrar() {
  var email = document.getElementById('email').value;
  var clave = document.getElementById('clave').value;
  var boton = document.getElementById('btnEntrar');
  var error = document.getElementById('errorLogin');

  if (!email || !clave) {
    error.textContent = 'Ingrese correo y clave.';
    error.classList.remove('oculto');
    return;
  }

  boton.disabled = true;
  boton.textContent = 'Verificando...';
  error.classList.add('oculto');

  google.script.run
    .withSuccessHandler(function (r) {
      boton.disabled = false;
      boton.textContent = 'Entrar';
      if (!r.ok) {
        error.textContent = r.mensaje;
        error.classList.remove('oculto');
        return;
      }
      TOKEN = r.token;
      document.getElementById('login').classList.add('oculto');
      document.getElementById('app').classList.remove('oculto');
      cargarTablero(false);
    })
    .withFailureHandler(function (e) {
      boton.disabled = false;
      boton.textContent = 'Entrar';
      error.textContent = e.message;
      error.classList.remove('oculto');
    })
    .iniciarSesion(email, clave);
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !document.getElementById('login').classList.contains('oculto')) {
    entrar();
  }
});

function salir() {
  google.script.run.cerrarSesion(TOKEN);
  TOKEN = '';
  location.reload();
}

/* ==========================================================================
   CARGA DEL TABLERO
   ========================================================================== */

function cargarTablero(forzar, escenario) {
  var solicitudActual = ++SECUENCIA_TABLERO;
  document.getElementById('errorGeneral').classList.add('oculto');
  mostrarCargando(true, forzar
    ? 'Recalculando con las rutas guardadas...'
    : 'Leyendo la planificación de Sheets...');

  google.script.run
    .withSuccessHandler(function (payload) {
      if (solicitudActual !== SECUENCIA_TABLERO) return;
      DATOS = payload;
      mostrarCargando(false);
      dibujarTodo();
      cargarAgenda();
      if (document.getElementById('vista-equipo').classList.contains('activa')) cargarOrden();
      if (VISTA_INICIAL && VISTA_INICIAL !== 'hoy') {
        mostrar(VISTA_INICIAL);
        VISTA_INICIAL = '';
      }
    })
    .withFailureHandler(function (e) { if (solicitudActual === SECUENCIA_TABLERO) mostrarError(e); })
    [forzar ? 'recalcular' : 'obtenerTablero'](TOKEN, escenario || null,
                                               forzar ? undefined : false);
}

function recalcular() {
  cargarTablero(true, DATOS ? DATOS.escenarioActivo : null);
}

function cambiarEscenario() {
  cargarTablero(false, document.getElementById('selectorEscenario').value);
}

function mostrarCargando(activo, texto) {
  document.getElementById('cargando').style.display = activo ? 'block' : 'none';
  if (texto) document.getElementById('textoCargando').textContent = texto;
  document.querySelectorAll('.vista').forEach(function (v) {
    v.style.visibility = activo ? 'hidden' : 'visible';
  });
}

function mostrarError(e) {
  mostrarCargando(false);
  var caja = document.getElementById('errorGeneral');
  var mensaje = escapar(e.message).replace(/\n/g, '<br>');

  // Si lo que falta son parametros, se ofrece el arreglo aqui mismo en vez de
  // mandar al usuario a buscar el boton en otra pestana.
  var faltanParametros = e.message.indexOf('le faltan') !== -1 &&
                         e.message.indexOf('parametros') !== -1;

  caja.innerHTML = '<b>No se pudo calcular el plan</b><br><br>' + mensaje +
    (faltanParametros
      ? '<div style="margin-top:14px"><button class="btn" onclick="arreglarParametros()">' +
        'Agregar los par&aacute;metros que faltan y recalcular</button>' +
        '<div class="chico" style="margin-top:7px">Solo agrega lo que falta al final de ' +
        'CONFIG. No borra el plan ni cambia ning&uacute;n valor ya configurado.</div></div>'
      : '');
  caja.classList.remove('oculto');
}

/** Arregla los parametros faltantes desde la pantalla de error. */
function arreglarParametros() {
  var caja = document.getElementById('errorGeneral');
  caja.innerHTML = '<div class="cargando"><div class="girador"></div>' +
                   'Agregando los par&aacute;metros que faltan...</div>';

  google.script.run
    .withSuccessHandler(function (r) {
      caja.innerHTML = '<b>Listo.</b><br>' + escapar(r.mensaje) + '<br>Recalculando...';
      setTimeout(function () {
        caja.classList.add('oculto');
        cargarTablero(true);
      }, 1200);
    })
    .withFailureHandler(function (err) {
      caja.innerHTML = '<b>No se pudo arreglar autom&aacute;ticamente</b><br><br>' +
        escapar(err.message) + '<br><br>Abra la planilla y use el men&uacute; ' +
        '<b>Servicio T&eacute;cnico, Actualizar CONFIG con par&aacute;metros nuevos</b>.';
    })
    .sincronizarParametrosWeb(TOKEN);
}

function mostrar(vista) {
  // Las direcciones antiguas siguen funcionando: se redirigen a la pantalla
  // nueva que absorbio esa seccion.
  var EQUIVALENCIAS = {
    resumen: 'hoy', operacion: 'hoy',
    calendario: 'agenda',
    gastos: 'dinero', transporte: 'dinero', peajes: 'dinero',
    tecnicos: 'equipo', orden: 'equipo',
    gestion: 'ajustes', configuracion: 'ajustes', guia: 'ajustes'
  };
  if (EQUIVALENCIAS[vista]) vista = EQUIVALENCIAS[vista];
  if (!document.getElementById('vista-' + vista)) vista = 'hoy';

  // Cada vista explica sola que es y como leerla, para quien la abre
  // por primera vez. Vive en Ayuda.html.
  inyectarAyuda(vista);
  if (vista === 'ajustes') { dibujarManual(); revisarParametros(); cargarEditor(); }
  document.querySelectorAll('.vista').forEach(function (v) { v.classList.remove('activa'); });
  document.querySelectorAll('.pestana').forEach(function (p) { p.classList.remove('activa'); });
  var destino = document.getElementById('vista-' + vista);
  if (destino) destino.classList.add('activa');
  var pestana = document.querySelector('.pestana[data-vista="' + vista + '"]');
  if (pestana) pestana.classList.add('activa');

  // Google Charts necesita que el contenedor sea visible para medir.
  if (DATOS && GRAFICOS_LISTOS) setTimeout(dibujarGraficos, 30);
  if (vista === 'equipo' && DATOS) cargarOrden();
  if (vista === 'agenda' && DATOS) llenarAsistente();
  if (vista === 'gestion' && DATOS) cargarEditor();
  if (vista === 'calendario') cargarAgenda();
  if (vista === 'peajes' && !document.getElementById('tablaPlazas').innerHTML) {
    cargarPeajes();
  }
}

/* ==========================================================================
   DIBUJO GENERAL
   ========================================================================== */

function dibujarTodo() {
  var R = DATOS.resultado;
  var T = R.totales;

  // Cabecera
  var generado = new Date(DATOS.generado);
  document.getElementById('metaCabecera').innerHTML =
    'Actualizado ' + generado.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) +
    (DATOS.desdeCache ? ' · desde cache' : '') +
    '<br>' + DATOS.maps.consultas + ' consultas a Maps';

  // Selector de escenario
  var sel = document.getElementById('selectorEscenario');
  if (!sel.options.length) {
    DATOS.escenarios.forEach(function (e) {
      var op = document.createElement('option');
      op.value = e.id;
      op.textContent = e.titulo;
      sel.appendChild(op);
    });
  }
  sel.value = DATOS.escenarioActivo;

  dibujarKpis(T);
  dibujarAlertas(R.alertas);
  dibujarEscenarios();
  dibujarConclusiones();
  dibujarCategorias(T);
  dibujarLocalidades(R.localidades);
  dibujarTransferencias(R.transferencias);
  dibujarTecnicos(R.porTecnico);
  dibujarMatrices();
  dibujarModos();
  dibujarCircuitos();
  dibujarRutas();
  llenarSelectores();
  dibujarGraficosBasicos();
  if (GRAFICOS_LISTOS) dibujarGraficos();
}

function dibujarKpis(T) {
  var tarjetas = [
    ['Equipos planificados', T.equipos, T.localidades + ' localidades atendidas', false],
    ['Gasto total del plan', pesos(T.gastoTotal), pesos(T.gastoPorEquipo) + ' por equipo', true],
    ['Dias habiles usados', T.diasHabiles, T.tramos + ' tramos planificados', false],
    ['Utilizacion de la dotacion', porciento(T.utilizacionGlobal),
     porciento(T.porcentajeProductivo) + ' de tiempo productivo', false],
    ['Kilometros totales', numero(T.km) + ' km', numero(T.litros, 1) + ' L de diesel', false],
    ['Noches de hotel', T.nochesPersona, pesos(T.hotel) + ' en alojamiento', false],
    ['Viaticos', T.tecnicoDias + ' tecnico-dia', pesos(T.viatico) + ' a transferir', false],
    ['Jornadas sobre el límite', T.fueraDeLey,
     T.enSobretiempo + ' con sobretiempo pagado', T.fueraDeLey > 0]
  ];

  document.getElementById('kpis').innerHTML = tarjetas.map(function (k) {
    return '<div class="kpi">' +
      '<div class="etiqueta">' + k[0] + '</div>' +
      '<div class="valor' + (k[3] ? ' acento' : '') + '">' + k[1] + '</div>' +
      '<div class="pie">' + k[2] + '</div></div>';
  }).join('');
}

function dibujarAlertas(alertas) {
  var caja = document.getElementById('alertas');
  if (!alertas.length) {
    caja.innerHTML = '<div class="alerta bien">Sin alertas: el plan pasa todas las ' +
                     'validaciones.</div>';
    return;
  }
  var errores = alertas.filter(function (a) { return a.nivel === 'error'; });
  var avisos = alertas.filter(function (a) { return a.nivel !== 'error'; });

  caja.innerHTML = errores.concat(avisos).map(function (a) {
    return '<div class="alerta ' + (a.nivel === 'error' ? 'error' : 'aviso') + '">' +
      '<span class="id">' + a.id + '</span>' + humanizar(escapar(a.mensaje)) + '</div>';
  }).join('');
}

function dibujarEscenarios() {
  var c = DATOS.comparacionEscenario;
  var activo = DATOS.escenarios.filter(function (e) {
    return e.id === DATOS.escenarioActivo; })[0];

  document.getElementById('ayudaEscenario').textContent =
    activo.descripcion + ' Se compara contra: ' + c.titulo + '.';

  var filas = c.filas.map(function (f) {
    var dif = f.activo - f.alterno;
    var fmt = f.moneda ? pesos : function (x) { return numero(x, 2); };
    return '<tr><td>' + f.concepto + '</td>' +
      '<td class="num"><b>' + fmt(f.activo) + '</b></td>' +
      '<td class="num">' + fmt(f.alterno) + '</td>' +
      '<td class="num" style="color:' + (dif <= 0 ? 'var(--ok)' : 'var(--acento)') + '">' +
      (dif > 0 ? '+' : '') + fmt(dif) + '</td></tr>';
  }).join('');

  document.getElementById('tablaEscenarios').innerHTML =
    '<tr><th>Indicador</th><th class="num">Escenario activo</th>' +
    '<th class="num">' + escapar(c.titulo) + '</th><th class="num">Diferencia</th></tr>' + filas;
}

function dibujarConclusiones() {
  var T = DATOS.resultado.totales;
  var c = DATOS.comparacionEscenario;
  var p = DATOS.resultado.parametros;

  var textos = [];

  textos.push({
    titulo: 'Distribución del tiempo de la cuadrilla',
    texto: 'De ' + numero(T.horasHombre, 1) + ' horas-hombre del plan, ' +
      numero(T.horasViaje, 1) + ' h se consumen en traslado, un ' +
      porciento(T.porcentajeTraslado) + ' del tiempo pagado. Solo ' +
      numero(T.horasEnSitio, 1) + ' h son trabajo efectivo en el sitio. Sumar tecnicos ' +
      'o camionetas debe evaluarse con demanda adicional y disponibilidad. Compare ' +
      'la agrupación de destinos antes de invertir.'
  });

  if (c.ahorroHoras !== 0) {
    textos.push({
      titulo: 'Mejora propuesta: ' + numero(Math.abs(c.ahorroHoras), 1) + ' horas-persona de diferencia',
      texto: 'Enviar al cliente el enlace de Drive antes de la visita permite dictar una ' +
        'sola sesión de 15 minutos por sitio en vez de ' +
        (p.P_T_CAPACITACION * 60) + ' minutos por equipo. La diferencia frente al ' +
        'escenario literal del enunciado es de ' + numero(Math.abs(c.ahorroHoras), 1) +
        ' horas-hombre. No se apura al tecnico: se cambia el momento en que el cliente ' +
        'aprende.'
    });
  }

  var costoNoche = p.P_TECNICOS_POR_CUADRILLA * (p.P_HOTEL + p.P_VIATICO);
  var costoExtra = 2 * p.P_TECNICOS_POR_CUADRILLA * p.P_COSTO_HORA_TECNICO * p.P_RECARGO_HORA_EXTRA;
  textos.push({
    titulo: 'Comparar sobretiempo y alojamiento',
    texto: 'Dos horas extra para una cuadrilla de ' + p.P_TECNICOS_POR_CUADRILLA +
      ' cuestan ' + pesos(costoExtra) + '. Pernoctar esa misma noche cuesta ' +
      pesos(costoNoche) + ' entre hotel y viático del día siguiente. Esta comparación ' +
      'orienta la decisión; no cambia las pernoctas del plan. Revise el límite configurado de ' +
      (p.P_JORNADA_DIA_MAX + (p.P_PERMITE_HORAS_EXTRA ? p.P_HORAS_EXTRA_MAX_DIA : 0)) + ' h y las condiciones de conducción.'
  });

  if (!p.P_HERRAMIENTAS_TRANSPORTABLES) {
    textos.push({
      titulo: 'Las herramientas amarran la flota',
      texto: 'Con las herramientas fijas en las camionetas, bus y avion dejan de ser ' +
        'ejecutables aunque el comparador los muestre mas baratos. Dos sets portatiles ' +
        'cuestan ' + pesos(2 * p.P_COSTO_SET_HERRAMIENTAS) + ', bastante menos que una ' +
        'septima camioneta a ' + pesos(p.P_COSTO_CAMIONETA_NUEVA) + '.'
    });
  }

  document.getElementById('conclusiones').innerHTML = textos.map(function (t) {
    return '<div class="hallazgo"><h3>' + t.titulo + '</h3><p>' + t.texto + '</p></div>';
  }).join('');
}

/* ==========================================================================
   GASTOS
   ========================================================================== */

function dibujarCategorias(T) {
  var cats = [
    ['Combustible', T.combustible], ['Peajes', T.peajes],
    ['Desgaste y mantencion', T.desgaste], ['Pasajes', T.pasajes],
    ['Flete de herramientas', T.flete], ['Arriendo en destino', T.arriendo],
    ['Traslados', T.traslados], ['Hotel', T.hotel],
    ['Viatico (incluye colacion)', T.viatico], ['Sobretiempo', T.sobretiempo],
    ['Holgura de imprevistos', T.imprevistos]
  ].filter(function (c) { return c[1] > 0; });

  var total = T.gastoTotal;
  document.getElementById('tablaCategorias').innerHTML =
    '<tr><th>Categoria</th><th class="num">Monto</th><th class="num">Porcentaje</th>' +
    '<th>Participacion</th></tr>' +
    cats.map(function (c) {
      var pct = c[1] / total;
      return '<tr><td>' + c[0] + '</td><td class="num">' + pesos(c[1]) + '</td>' +
        '<td class="num">' + (pct * 100).toFixed(1) + '%</td>' +
        '<td><div class="barra-fondo"><div class="barra" style="width:' +
        (pct * 100).toFixed(1) + '%"></div></div></td></tr>';
    }).join('') +
    '<tr style="font-weight:700;background:#F0F2F5"><td>TOTAL</td>' +
    '<td class="num">' + pesos(total) + '</td><td class="num">100%</td><td></td></tr>';
}

function dibujarLocalidades(locs) {
  document.getElementById('tablaLocalidades').innerHTML =
    '<tr><th>Localidad</th><th>Region</th><th class="num">Equipos</th>' +
    '<th class="num">Horas-hombre</th><th class="num">Combustible</th>' +
    '<th class="num">Peajes</th><th class="num">Hotel</th><th class="num">Viatico</th>' +
    '<th class="num">Total</th><th class="num">Por equipo</th></tr>' +
    locs.map(function (L) {
      return '<tr><td><b>' + escapar(L.localidad) + '</b></td>' +
        '<td class="chico">' + escapar(L.region) + '</td>' +
        '<td class="num">' + L.equipos + '</td>' +
        '<td class="num">' + numero(L.horasHombre, 1) + '</td>' +
        '<td class="num">' + pesos(L.combustible) + '</td>' +
        '<td class="num">' + pesos(L.peajes) + '</td>' +
        '<td class="num">' + pesos(L.hotel) + '</td>' +
        '<td class="num">' + pesos(L.viatico) + '</td>' +
        '<td class="num"><b>' + pesos(L.total) + '</b></td>' +
        '<td class="num">' + pesos(L.costoPorEquipo) + '</td></tr>';
    }).join('');
}

function dibujarTransferencias(trs) {
  var total = trs.reduce(function (s, t) { return s + t.total; }, 0);
  document.getElementById('tablaTransferencias').innerHTML =
    '<tr><th>Tecnico</th><th class="c">Dias</th><th class="c">Noches</th>' +
    '<th class="num">Viatico</th><th class="num">Hotel</th><th class="num">Combustible</th>' +
    '<th class="num">Peajes</th><th class="num">Imprevistos</th>' +
    '<th class="num">A transferir</th></tr>' +
    trs.map(function (t) {
      return '<tr><td><b>' + escapar(t.nombre) + '</b>'
        + '<br><span class="chico">' + t.tecnico + '</span></td>' +
        '<td class="c">' + t.dias + '</td><td class="c">' + t.noches + '</td>' +
        '<td class="num">' + pesos(t.viatico) + '</td>' +
        '<td class="num">' + pesos(t.hotel) + '</td>' +
        '<td class="num">' + pesos(t.combustible) + '</td>' +
        '<td class="num">' + pesos(t.peajes) + '</td>' +
        '<td class="num">' + pesos(t.imprevistos) + '</td>' +
        '<td class="num"><b style="color:var(--acento)">' + pesos(t.total) + '</b></td></tr>';
    }).join('') +
    '<tr style="font-weight:700;background:#F0F2F5"><td colspan="8">TOTAL A TRANSFERIR</td>' +
    '<td class="num">' + pesos(total) + '</td></tr>';
}

/* ==========================================================================
   TECNICOS
   ========================================================================== */

var ordenTecnicos = { campo: 'utilizacion', desc: true };

function dibujarTecnicos(lista) {
  var datos = lista.slice().sort(function (a, b) {
    var x = a[ordenTecnicos.campo], y = b[ordenTecnicos.campo];
    if (typeof x === 'string') return ordenTecnicos.desc ? y.localeCompare(x) : x.localeCompare(y);
    return ordenTecnicos.desc ? y - x : x - y;
  });

  var cols = [
    ['tecnico', 'Codigo', false], ['nombre', 'Nombre', false],
    ['horas', 'Horas', true], ['horasEnSitio', 'En sitio', true],
    ['horasViaje', 'En traslado', true], ['equipos', 'Equipos', true],
    ['nLocalidades', 'Localidades', true], ['dias', 'Dias', true],
    ['diasFueraRM', 'Dias fuera RM', true], ['noches', 'Noches', true],
    ['utilizacion', 'Utilizacion', true]
  ];

  document.getElementById('tablaTecnicos').innerHTML =
    '<tr>' + cols.map(function (c) {
      return '<th class="orden' + (c[2] ? ' num' : '') +
        '" onclick="ordenarTecnicos(\'' + c[0] + '\')">' + c[1] +
        (ordenTecnicos.campo === c[0] ? (ordenTecnicos.desc ? ' ▾' : ' ▴') : '') + '</th>';
    }).join('') + '<th>Diagnostico</th></tr>' +
    datos.map(function (t) {
      var pct = Math.min(100, (t.utilizacion || 0) * 100);
      var clase = pct > 95 ? 'alta' : (pct > 75 ? 'media' : 'baja');
      return '<tr><td class="chico">' + t.tecnico + '</td><td><b>' + escapar(t.nombre) + '</b>' +
        (t.licencia === 'No' ? ' <span class="pastilla neutra">sin licencia</span>' : '') +
        '</td>' +
        '<td class="num">' + numero(t.horas, 1) + '</td>' +
        '<td class="num">' + numero(t.horasEnSitio, 1) + '</td>' +
        '<td class="num">' + numero(t.horasViaje, 1) + '</td>' +
        '<td class="num">' + numero(t.equipos, 1) + '</td>' +
        '<td class="num">' + t.nLocalidades + '</td>' +
        '<td class="num">' + t.dias + '</td>' +
        '<td class="num">' + t.diasFueraRM + '</td>' +
        '<td class="num">' + t.noches + '</td>' +
        '<td class="num">' + porciento(t.utilizacion) +
        '<div class="barra-fondo" style="height:5px;margin-top:3px">' +
        '<div class="barra ' + clase + '" style="width:' + pct + '%"></div></div></td>' +
        '<td class="chico">' + (t.diagnostico ? t.diagnostico.etiqueta : '') + '</td></tr>';
    }).join('');
}

function ordenarTecnicos(campo) {
  if (ordenTecnicos.campo === campo) ordenTecnicos.desc = !ordenTecnicos.desc;
  else { ordenTecnicos.campo = campo; ordenTecnicos.desc = true; }
  dibujarTecnicos(DATOS.resultado.porTecnico);
}

function dibujarMatrices() {
  var R = DATOS.resultado;
  var p = R.parametros;
  var dias = [];
  R.tramos.forEach(function (t) { if (dias.indexOf(t.dia) === -1) dias.push(t.dia); });
  dias.sort(function (a, b) { return Number(a.substring(1)) - Number(b.substring(1)); });

  var porTecnicoDia = {};
  R.tecnicoDias.forEach(function (td) { porTecnicoDia[td.tecnico + '|' + td.dia] = td.horas; });

  var tecnicos = DATOS.tecnicos;

  var encabezado = '<tr><th>Tecnico</th>' + dias.map(function (d) {
    var f = DATOS.fechas[d];
    var texto = d;
    if (f) {
      var fecha = new Date(f);
      texto += '<br><span class="chico">' +
        String(fecha.getDate()).padStart(2, '0') + '-' +
        String(fecha.getMonth() + 1).padStart(2, '0') + '</span>';
    }
    return '<th>' + texto + '</th>';
  }).join('') + '<th>Total</th></tr>';

  var construir = function (modo) {
    return encabezado + tecnicos.map(function (tec) {
      var total = 0, totalLibre = 0;
      var celdas = dias.map(function (d) {
        var h = porTecnicoDia[tec.codigo + '|' + d] || 0;
        total += h;
        if (modo === 'libres') {
          var libre = Math.max(0, p.P_JORNADA_DIA - h);
          totalLibre += libre;
          return '<td class="' + (libre > 4 ? 'celda-ok' :
            (libre > 1 ? 'celda-tol' : 'celda-fue')) + '">' + numero(libre, 1) + '</td>';
        }
        if (!h) return '<td class="celda-vacia">—</td>';
        var clase = h <= p.P_JORNADA_DIA ? 'celda-ok' :
          (h <= p.P_JORNADA_DIA_MAX ? 'celda-tol' :
            (h <= p.P_JORNADA_DIA_MAX + (p.P_PERMITE_HORAS_EXTRA ? p.P_HORAS_EXTRA_MAX_DIA : 0) ? 'celda-sob' : 'celda-fue'));
        return '<td class="' + clase + '">' + numero(h, 1) + '</td>';
      }).join('');

      var totalMostrado = (modo === 'libres')
        ? totalLibre : total;

      return '<tr><td class="nombre">' + escapar(tec.nombre) +
        '<br><span class="chico">' + tec.codigo + '</span></td>' +
        celdas + '<td><b>' + numero(totalMostrado, 1) + '</b></td></tr>';
    }).join('');
  };

  document.getElementById('matrizAsignadas').innerHTML = construir('asignadas');
  document.getElementById('matrizLibres').innerHTML = construir('libres');
}

/**
 * Detalle completo de un destino: cada modo con su desglose de tiempo y de
 * costo, en lenguaje comun. Existe para que nadie tenga que creer en el total:
 * puede ver de donde sale cada hora y cada peso.
 */
function dibujarDetalleModo() {
  var sel = document.getElementById('selectorDetalleModo');
  var caja = document.getElementById('detalleModo');
  if (!sel || !caja) return;

  var c = DATOS.comparadorModos.filter(function (x) {
    return x.localidad === sel.value; })[0];
  if (!c) { caja.innerHTML = ''; return; }

  var tarjetas = c.opciones.map(function (o) {
    var gana = o.modo === c.masEconomico;

    var tiempo = (o.desgloseTiempo || []).map(function (x) {
      return '<div class="desglose-fila"><span class="concepto">' + escapar(x.concepto) +
        '<span class="detalle">' + escapar(x.detalle || '') + '</span></span>' +
        '<span class="valor">' + numero(x.horas, 2) + ' h</span></div>';
    }).join('');

    var costo = (o.desgloseCosto || []).map(function (x) {
      return '<div class="desglose-fila"><span class="concepto">' + escapar(x.concepto) +
        '<span class="detalle">' + escapar(x.detalle || '') + '</span></span>' +
        '<span class="valor">' + pesos(x.monto) + '</span></div>';
    }).join('');

    return '<div class="tarjeta-modo' + (gana ? ' ganadora' : '') +
      (o.aplicable ? '' : ' no-aplica') + '">' +
      '<h3><span>' + o.modo + (gana ? ' · más económico' : '') + '</span>' +
      '<span class="monto-modo">' + pesos(o.total) + '</span></h3>' +
      '<div class="chico">' + o.dias + ' día(s) de viaje · ' + o.noches +
        ' noche(s) de hotel · ' + numero(o.horasIda, 2) + ' h de ida</div>' +
      (o.nota ? '<div class="ayuda-ojo" style="margin-top:10px">' + escapar(o.nota) +
                '</div>' : '') +

      (tiempo ? '<div class="desglose"><h3 style="font-size:11px;text-transform:uppercase;' +
        'letter-spacing:.5px;color:var(--tenue);margin:0 0 6px">De dónde salen las horas' +
        '</h3>' + tiempo +
        '<div class="desglose-total"><span>Total de ida, puerta a puerta</span>' +
        '<span>' + numero(o.horasIda, 2) + ' h</span></div></div>' : '') +

      (costo ? '<div class="desglose"><h3 style="font-size:11px;text-transform:uppercase;' +
        'letter-spacing:.5px;color:var(--tenue);margin:0 0 6px">De dónde salen los pesos' +
        '</h3>' + costo +
        '<div class="desglose-total"><span>Transporte</span><span>' +
        pesos(o.transporte) + '</span></div>' +
        '<div class="desglose-fila"><span class="concepto">Hotel</span>' +
        '<span class="valor">' + pesos(o.hotel) + '</span></div>' +
        '<div class="desglose-fila"><span class="concepto">Viáticos</span>' +
        '<span class="valor">' + pesos(o.viatico) + '</span></div>' +
        '<div class="desglose-total"><span>TOTAL DEL VIAJE</span><span>' +
        pesos(o.total) + '</span></div></div>' : '') +
      '</div>';
  }).join('');

  caja.innerHTML = dibujarRecomendacion(c) +
    '<p class="ayuda">Viaje completo de ida y vuelta a <b>' + escapar(c.localidad) +
    '</b> para una cuadrilla de ' + c.tecnicos + ' técnicos que instala ' + c.equipos +
    ' equipo(s). Todos los totales incluyen hotel y viáticos, no solo el pasaje.</p>' +
    '<div class="rejilla rejilla-3">' + tarjetas + '</div>';
}

/** Revisa si CONFIG tiene todos los parametros que el motor necesita. */
function revisarParametros() {
  var caja = document.getElementById('estadoParametros');
  if (!caja) return;

  google.script.run
    .withSuccessHandler(function (d) {
      if (d.alDia) {
        caja.innerHTML = '<span class="pastilla ok">AL DIA</span> CONFIG tiene los ' +
          d.total + ' parámetros del esquema.';
        document.getElementById('btnSincronizar').disabled = true;
      } else {
        caja.innerHTML = '<span class="pastilla fuera">FALTAN ' + d.faltantes.length +
          '</span> ' + d.faltantes.map(function (f) {
            return escapar(f.etiqueta); }).join(' · ') +
          '<br><b>Presione el botón para agregarlos.</b> No se pierde nada de lo ya configurado.';
        document.getElementById('btnSincronizar').disabled = false;
      }
    })
    .withFailureHandler(function (e) {
      caja.textContent = 'No se pudo revisar: ' + e.message;
    })
    .diagnosticarParametrosWeb(TOKEN);
}

/** Agrega los parametros que falten y vuelve a calcular. */
function sincronizarParametros() {
  var boton = document.getElementById('btnSincronizar');
  var caja = document.getElementById('estadoParametros');
  boton.disabled = true;
  boton.textContent = 'Actualizando…';

  google.script.run
    .withSuccessHandler(function (r) {
      boton.textContent = 'Actualizar CONFIG con parámetros nuevos';
      caja.innerHTML = '<span class="pastilla ok">LISTO</span> ' + escapar(r.mensaje) +
        (r.agregados.length
          ? '<br><span class="chico">' + r.agregados.map(escapar).join('<br>') + '</span>'
          : '');
      // Con los parametros nuevos ya creados, se recalcula solo.
      setTimeout(function () { cargarTablero(true); }, 800);
    })
    .withFailureHandler(function (e) {
      boton.disabled = false;
      boton.textContent = 'Actualizar CONFIG con parámetros nuevos';
      caja.innerHTML = '<span class="pastilla fuera">ERROR</span> ' + escapar(e.message);
    })
    .sincronizarParametrosWeb(TOKEN);
}

/**
 * Dibuja la recomendacion explicada de un destino: que se eligio, cuanto
 * cuesta, cual era la mas barata y por que no se tomo esa.
 */
function dibujarRecomendacion(c) {
  var r = c.recomendacion;
  if (!r || !r.elegida) return '';

  var comparativa = c.opciones.slice()
    .sort(function (a, b) { return a.total - b.total; })
    .map(function (o) {
      var esElegida = (o.modo === r.modo && o.dotacion === r.dotacion);
      var dif = o.total - r.total;
      return '<tr' + (esElegida ? ' style="background:#E6F4EA;font-weight:600"' : '') + '>' +
        '<td>' + (esElegida ? '&#9654; ' : '') + escapar(o.modo) + '</td>' +
        '<td class="c">' + o.dotacion + '</td>' +
        '<td class="c">' + o.dias + 'd ' + o.noches + 'n</td>' +
        '<td class="num">' + numero(o.horasTotales, 1) + ' h</td>' +
        '<td class="num">' + (o.horasExtra ? numero(o.horasExtra, 2) + ' h' : '—') + '</td>' +
        '<td class="num">' + pesos(o.total) + '</td>' +
        '<td class="num">' + (esElegida ? '—' :
          (dif > 0 ? '+' : '') + pesos(Math.abs(dif)).replace('$', dif > 0 ? '$' : '-$')) +
        '</td>' +
        '<td class="chico">' + (o.riesgos && o.riesgos.length
          ? o.riesgos.map(function (x) {
              return '<span class="pastilla ' +
                (x.gravedad === 'alta' ? 'fuera' : 'tolerancia') + '">' +
                x.tipo.replace(/_/g, ' ').toLowerCase() + '</span>'; }).join(' ')
          : '<span class="pastilla ok">sin riesgos</span>') + '</td>' +
        '</tr>';
    }).join('');

  return '<div class="tarjeta" style="border-left:4px solid var(--ok)">' +
    '<h2>Por qué se eligió esta opción</h2>' +
    '<div class="rejilla rejilla-3" style="margin-bottom:14px">' +
      '<div class="kpi"><div class="etiqueta">Recomendado</div>' +
        '<div class="valor">' + escapar(r.modo) + '</div>' +
        '<div class="pie">' + r.dotacion + ' técnico(s) · ' + pesos(r.total) + '</div></div>' +
      '<div class="kpi"><div class="etiqueta">La más barata era</div>' +
        '<div class="valor" style="font-size:19px">' + escapar(r.masBarata.modo) + '</div>' +
        '<div class="pie">' + r.masBarata.dotacion + ' técnico(s) · ' +
        pesos(r.masBarata.total) + '</div></div>' +
      '<div class="kpi"><div class="etiqueta">Sobrecosto que se paga</div>' +
        '<div class="valor' + (r.sobrecosto > 0 ? ' acento' : '') + '">' +
        (r.sobrecosto > 0 ? pesos(r.sobrecosto) : 'ninguno') + '</div>' +
        '<div class="pie">' + (r.sobrecosto > 0 ? '+' + r.porcentajeSobrecosto + '%'
          : 'es la más económica') + '</div></div>' +
    '</div>' +
    '<div class="alerta ' + (r.sobrecosto > 0 ? 'aviso' : 'bien') + '">' +
      '<span class="id">EL RAZONAMIENTO</span>' + humanizar(escapar(r.texto)) + '</div>' +
    '<div class="tabla-envoltorio" style="margin-top:14px"><table class="datos">' +
      '<tr><th>Modo</th><th class="c">Téc</th><th class="c">Duración</th>' +
      '<th class="num">Horas totales</th><th class="num">H. extra</th>' +
      '<th class="num">Costo</th><th class="num">Diferencia</th>' +
      '<th>Riesgos detectados</th></tr>' + comparativa + '</table></div>' +
    '</div>';
}

/** Circuitos por corredor: agrupar contra ir por separado. */
function dibujarCircuitos() {
  var caja = document.getElementById('circuitos');
  if (!caja) return;

  var lista = (DATOS && DATOS.circuitos) || [];
  if (!lista.length) {
    caja.innerHTML = '<p class="chico">No hay corredores con dos o más localidades ' +
      'pendientes, así que no hay circuitos que evaluar.</p>';
    return;
  }

  var totalCircuito = 0, totalSeparado = 0;

  var tarjetas = lista.map(function (c) {
    var m = c.mejorCircuito;
    if (!m) return '';
    totalCircuito += c.conviene ? m.total : c.porSeparado;
    totalSeparado += c.porSeparado;

    var paradas = m.detalle.filter(function (t) { return t.hasta !== 'BASE'; })
      .map(function (t) {
        return '<tr><td>' + escapar(t.desde) + ' &rarr; <b>' + escapar(t.hasta) + '</b></td>' +
          '<td class="num">' + numero(t.km, 1) + ' km</td>' +
          '<td class="num">' + numero(t.horasViaje, 2) + ' h</td>' +
          '<td class="num">' + pesos(t.peaje) + '</td>' +
          '<td class="c">' + (t.equipos || '—') + '</td>' +
          '<td class="num">' + numero(t.horasEnSitio, 2) + ' h</td></tr>';
      }).join('');

    return '<div class="tarjeta" style="border-left:4px solid ' +
      (c.conviene ? 'var(--ok)' : 'var(--acento)') + '">' +
      '<h2>Corredor ' + escapar(c.corredor) + ' · ' + c.localidades.length +
        ' localidades</h2>' +
      '<p class="ayuda"><b>' + escapar(m.recorrido) + '</b></p>' +
      '<div class="rejilla rejilla-4" style="margin-bottom:12px">' +
        '<div class="kpi"><div class="etiqueta">En un circuito</div>' +
          '<div class="valor">' + pesos(m.total) + '</div>' +
          '<div class="pie">' + m.dotacion + ' téc · ' + m.dias + 'd ' + m.noches + 'n · ' +
          numero(m.km, 0) + ' km</div></div>' +
        '<div class="kpi"><div class="etiqueta">Por separado</div>' +
          '<div class="valor">' + pesos(c.porSeparado) + '</div>' +
          '<div class="pie">' + c.localidades.length + ' viajes distintos</div></div>' +
        '<div class="kpi"><div class="etiqueta">' +
          (c.conviene ? 'Se ahorra' : 'Se pierde') + '</div>' +
          '<div class="valor ' + (c.conviene ? '' : 'acento') + '">' +
          pesos(Math.abs(c.ahorro)) + '</div>' +
          '<div class="pie">' + (c.conviene ? 'conviene agrupar'
            : 'conviene ir por separado') + '</div></div>' +
        '<div class="kpi"><div class="etiqueta">Costo por equipo</div>' +
          '<div class="valor">' + pesos(m.costoPorEquipo) + '</div>' +
          '<div class="pie">' + m.equipos + ' equipos en el circuito</div></div>' +
      '</div>' +
      '<div class="alerta ' + (c.conviene ? 'bien' : 'aviso') + '">' +
        '<span class="id">' + (c.conviene ? 'CONVIENE AGRUPAR'
          : 'NO CONVIENE AGRUPAR') + '</span>' + humanizar(escapar(c.texto)) + '</div>' +
      '<details style="margin-top:12px"><summary>Ver el recorrido tramo por tramo</summary>' +
        '<div class="tabla-envoltorio" style="margin-top:10px"><table class="datos">' +
        '<tr><th>Tramo</th><th class="num">Km</th><th class="num">Viaje</th>' +
        '<th class="num">Peaje</th><th class="c">Equipos</th>' +
        '<th class="num">En sitio</th></tr>' + paradas + '</table></div>' +
        '<p class="chico" style="margin-top:8px">Hotel ' + pesos(m.hotel) +
        ' · Viáticos ' + pesos(m.viatico) + ' · Combustible ' + pesos(m.combustible) +
        ' · Peajes ' + pesos(m.peajes) + ' · Desgaste ' + pesos(m.desgaste) +
        (m.sobretiempo ? ' · Sobretiempo ' + pesos(m.sobretiempo) : '') + '</p>' +
      '</details></div>';
  }).join('');

  var ahorroTotal = totalSeparado - totalCircuito;

  caja.innerHTML =
    '<div class="alerta ' + (ahorroTotal > 0 ? 'bien' : 'aviso') +
      '" style="margin-bottom:16px"><span class="id">RESUMEN DE TODOS LOS CORREDORES</span>' +
      'Tomando en cada corredor la opción que convenga, el total es ' + pesos(totalCircuito) +
      ' contra ' + pesos(totalSeparado) + ' atendiendo cada localidad por su cuenta: ' +
      (ahorroTotal > 0 ? 'se ahorran ' + pesos(ahorroTotal) + '.'
                       : 'no hay diferencia a favor de agrupar.') +
      '</div>' + tarjetas;
}

/* ==========================================================================
   ASISTENTE DE ORDEN
   Responde la pregunta con la que parte cualquier coordinador: me llamaron
   de Copiapo por 5 equipos, cuanto me sale y a quien mando.
   ========================================================================== */

var ASISTENTE_ULTIMO = null;
var ASISTENTE_TEMPORIZADOR = null;

/** Llena el selector de destinos la primera vez que se abre la pantalla. */
function llenarAsistente() {
  var sel = document.getElementById('asisLocalidad');
  if (!sel || sel.options.length) return;

  google.script.run
    .withSuccessHandler(function (lista) {
      sel.innerHTML = lista.map(function (d) {
        return '<option value="' + escapar(d.localidad) + '" data-equipos="' + d.equipos +
               '">' + escapar(d.localidad) + ' · ' + escapar(d.region) + '</option>';
      }).join('');

      // Al cambiar el destino se precarga la cantidad de equipos pendientes.
      sel.addEventListener('change', function () {
        var op = sel.options[sel.selectedIndex];
        var eq = Number(op.getAttribute('data-equipos')) || 1;
        document.getElementById('asisEquipos').value = eq;
      });

      if (lista.length) {
        document.getElementById('asisEquipos').value = lista[0].equipos || 1;
        consultarAsistente();
      }
    })
    .withFailureHandler(function (e) {
      document.getElementById('asistenteResultado').innerHTML =
        '<div class="alerta error">' + escapar(e.message) + '</div>';
    })
    .listarDestinos(TOKEN);
}

/** Consulta al servidor con un pequeno retardo, para no disparar en cada tecla. */
function consultarAsistente() {
  clearTimeout(ASISTENTE_TEMPORIZADOR);
  ASISTENTE_TEMPORIZADOR = setTimeout(ejecutarAsistente, 350);
}

function ejecutarAsistente() {
  var localidad = document.getElementById('asisLocalidad').value;
  var equipos = Number(document.getElementById('asisEquipos').value);
  var caja = document.getElementById('asistenteResultado');
  if (!localidad || !(equipos > 0)) return;

  caja.innerHTML = '<div class="cargando" style="padding:24px">' +
    '<div class="girador"></div>Calculando las alternativas…</div>';

  google.script.run
    .withSuccessHandler(function (r) {
      if (!r.ok) {
        caja.innerHTML = '<div class="alerta error">' + escapar(r.mensaje) + '</div>';
        return;
      }
      ASISTENTE_ULTIMO = r;
      caja.innerHTML = dibujarAsistente(r);
    })
    .withFailureHandler(function (e) {
      caja.innerHTML = '<div class="alerta error">' + escapar(e.message) + '</div>';
    })
    .asistenteOrden(TOKEN, { localidad: localidad, equipos: equipos });
}

/** Pinta el resultado: el titular, las alternativas y el porque. */
function dibujarAsistente(r) {
  var rec = r.recomendacion;
  var elegida = rec && rec.elegida;
  if (!elegida) {
    return '<div class="alerta aviso">' + escapar(r.titular) + '</div>';
  }

  // Una tarjeta por alternativa, ordenadas de la mas barata a la mas cara.
  var tarjetas = r.opciones.slice()
    .sort(function (a, b) { return a.total - b.total; })
    .map(function (o) {
      var esRecomendada = (o.modo === elegida.modo && o.dotacion === elegida.dotacion);
      var vehiculos = (o.modo === 'Camioneta')
        ? Math.ceil(o.dotacion / r.parametros.capacidadCamioneta) : 0;

      return '<div class="opcion-modo' + (esRecomendada ? ' recomendada' : '') +
        (o.aplicable ? '' : ' no-aplica') + '">' +
        (esRecomendada ? '<div class="cinta">RECOMENDADA</div>' : '') +
        '<div class="opcion-titulo">' + escapar(o.modo) + '</div>' +
        '<div class="opcion-monto">' + pesos(o.total) + '</div>' +
        '<div class="opcion-linea"><b>' + o.dotacion + '</b> técnico' +
          (o.dotacion > 1 ? 's' : '') +
          (vehiculos ? ' · <b>' + vehiculos + '</b> camioneta' + (vehiculos > 1 ? 's' : '') : '') +
        '</div>' +
        '<div class="opcion-linea">' + o.dias + ' día' + (o.dias > 1 ? 's' : '') +
          (o.noches ? ' · ' + o.noches + ' noche' + (o.noches > 1 ? 's' : '') + ' de hotel'
                    : ' · sin pernoctar') + '</div>' +
        '<div class="opcion-linea chico">' + numero(o.horasTotales, 1) + ' h en total' +
          (o.horasExtra ? ' · ' + numero(o.horasExtra, 1) + ' h extra' : '') + '</div>' +
        (o.riesgos && o.riesgos.length
          ? '<div class="opcion-riesgos">' + o.riesgos.map(function (x) {
              return '<span class="pastilla ' +
                (x.gravedad === 'alta' ? 'fuera' : 'tolerancia') + '">' +
                x.tipo.replace(/_/g, ' ').toLowerCase() + '</span>'; }).join(' ') + '</div>'
          : '<div class="opcion-riesgos"><span class="pastilla ok">sin riesgos</span></div>') +
        (o.aplicable ? '' : '<div class="chico">' + escapar(o.nota) + '</div>') +
        '</div>';
    }).join('');

  // Desglose de la recomendada, para que nadie tenga que creer en el total.
  var desglose = [
    ['Transporte', elegida.transporte],
    ['Hotel', elegida.hotel],
    ['Viáticos', elegida.viatico],
    ['Colación', elegida.colacion],
    ['Horas extra', elegida.sobretiempo]
  ].filter(function (x) { return x[1] > 0; })
   .map(function (x) {
     return '<div class="desglose-fila"><span class="concepto">' + x[0] + '</span>' +
            '<span class="valor">' + pesos(x[1]) + '</span></div>';
   }).join('');

  return '<div class="titular-asistente">' + escapar(r.titular) + '</div>' +

    '<div class="rejilla rejilla-4" style="margin-bottom:18px">' + tarjetas + '</div>' +

    '<div class="alerta ' + (rec.sobrecosto > 0 ? 'aviso' : 'bien') + '">' +
      '<span class="id">POR QUÉ ÉSTA Y NO LA MÁS BARATA</span>' +
      humanizar(escapar(rec.texto)) + '</div>' +

    '<div class="rejilla rejilla-2" style="margin-top:16px">' +
      '<div><h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;' +
        'color:var(--tenue);margin:0 0 8px">De dónde sale el monto</h3>' +
        '<div class="desglose">' + desglose +
        '<div class="desglose-total"><span>Total de la orden</span><span>' +
        pesos(elegida.total) + '</span></div></div></div>' +
      '<div><h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;' +
        'color:var(--tenue);margin:0 0 8px">Datos del destino</h3>' +
        '<div class="desglose">' +
        '<div class="desglose-fila"><span class="concepto">Dirección</span>' +
          '<span class="valor" style="font-weight:400;text-align:right">' +
          escapar(r.direccion || 'sin cargar') + '</span></div>' +
        '<div class="desglose-fila"><span class="concepto">Región</span>' +
          '<span class="valor" style="font-weight:400">' + escapar(r.region) + '</span></div>' +
        '<div class="desglose-fila"><span class="concepto">¿Paga viático?</span>' +
          '<span class="valor" style="font-weight:400">' +
          (r.enRM ? 'No, es RM: sólo colación' : 'Sí, está fuera de la RM') + '</span></div>' +
        (r.hotelReferencia
          ? '<div class="desglose-fila"><span class="concepto">Hotel de referencia</span>' +
            '<span class="valor" style="font-weight:400;text-align:right">' +
            escapar(r.hotelReferencia) + '</span></div>' : '') +
        '</div></div>' +
    '</div>' +

    '<div class="acciones-editor" style="margin-top:18px">' +
      '<button class="btn" onclick="usarRecomendacion()">Usar esta opción y llenar el formulario</button>' +
      '<span class="chico">Rellena abajo el destino, los equipos y la cuadrilla sugerida.</span>' +
    '</div>';
}

/** Traslada la recomendacion al formulario de la orden. */
function usarRecomendacion() {
  var r = ASISTENTE_ULTIMO;
  if (!r || !r.recomendacion || !r.recomendacion.elegida) return;
  var e = r.recomendacion.elegida;

  var poner = function (id, valor) {
    var el = document.getElementById(id);
    if (el && valor !== undefined && valor !== null) el.value = valor;
  };

  poner('agendaCliente', r.localidad);
  poner('agendaDireccion', r.direccion);
  poner('agendaEquipos', r.equipos);
  poner('agendaDias', e.dias);
  poner('agendaHotel', e.noches ? (r.hotelReferencia || '') : '');

  // Se marcan los primeros tecnicos disponibles segun la dotacion sugerida.
  var casillas = document.querySelectorAll('input[name="agendaTecnico"]');
  var marcados = 0;
  casillas.forEach(function (c) {
    c.checked = marcados < e.dotacion;
    if (c.checked) marcados++;
  });

  // Vehiculo solo si la recomendacion es camioneta.
  var selVehiculo = document.getElementById('agendaVehiculo');
  if (selVehiculo) {
    if (e.modo !== 'Camioneta') selVehiculo.value = '';
    else if (selVehiculo.options.length > 1) selVehiculo.selectedIndex = 1;
  }

  if (typeof invalidarPreviaAgenda === 'function') invalidarPreviaAgenda();

  var destino = document.getElementById('formularioAgenda');
  if (destino) destino.scrollIntoView({ behavior: 'smooth', block: 'start' });

  if (typeof mensajeAgenda === 'function') {
    mensajeAgenda('Formulario rellenado con la opción recomendada: ' + e.modo.toLowerCase() +
                  ' con ' + e.dotacion + ' técnico(s). Revisa la fecha y los técnicos, y ' +
                  'después aprieta "Calcular costos logísticos".');
  }
}


/* --------------------------------------------------------------------------
   CUALQUIER COMUNA DE CHILE
   El caso trae 16 destinos, pero el servicio atiende todo el pais. Estas
   funciones dejan cotizar cualquiera de las 346 comunas: se elige region,
   despues comuna, y el sistema resuelve la direccion de la municipalidad y le
   pregunta a Maps. Solo se consulta la comuna elegida, no las 346.
   -------------------------------------------------------------------------- */

var COMUNAS_CARGADAS = null;

/** Alterna entre los 16 destinos del caso y las 346 comunas del pais. */
function cambiarAlcance() {
  var pais = document.querySelector('input[name="alcanceAsis"]:checked').value === 'pais';
  document.getElementById('filaCaso').classList.toggle('oculto', pais);
  document.getElementById('filaPais').classList.toggle('oculto', !pais);
  document.getElementById('asistenteResultado').innerHTML = '';
  if (pais) cargarComunas();
  else consultarAsistente();
}

/** Trae el catalogo una sola vez y llena el selector de regiones. */
function cargarComunas() {
  if (COMUNAS_CARGADAS) { llenarComunasRegion(); return; }

  var sel = document.getElementById('asisRegion');
  sel.innerHTML = '<option>Cargando…</option>';

  google.script.run
    .withSuccessHandler(function (r) {
      COMUNAS_CARGADAS = r;
      sel.innerHTML = r.regiones.map(function (x) {
        return '<option value="' + escapar(x.region) + '">' + escapar(x.region) +
               ' (' + x.comunas.length + ')</option>';
      }).join('');
      if (r.aviso) {
        document.getElementById('asistenteResultado').innerHTML =
          '<div class="alerta aviso">' + escapar(r.aviso) + '</div>';
      }
      llenarComunasRegion();
    })
    .withFailureHandler(function (e) {
      sel.innerHTML = '';
      document.getElementById('asistenteResultado').innerHTML =
        '<div class="alerta error">' + escapar(e.message) + '</div>';
    })
    .listarComunasWeb(TOKEN);
}

/** Llena el selector de comunas segun la region elegida. */
function llenarComunasRegion() {
  if (!COMUNAS_CARGADAS) return;
  var region = document.getElementById('asisRegion').value;
  var grupo = COMUNAS_CARGADAS.regiones.filter(function (x) {
    return x.region === region; })[0];
  if (!grupo) return;

  var sel = document.getElementById('asisComuna');
  sel.innerHTML = grupo.comunas.slice().sort().map(function (c) {
    return '<option value="' + escapar(c) + '">' + escapar(c) + '</option>';
  }).join('');
}

/** Cotiza la comuna elegida. */
function consultarComuna() {
  var region = document.getElementById('asisRegion').value;
  var comuna = document.getElementById('asisComuna').value;
  var equipos = Number(document.getElementById('asisEquiposPais').value);
  var caja = document.getElementById('asistenteResultado');
  if (!comuna || !(equipos > 0)) return;

  caja.innerHTML = '<div class="cargando" style="padding:24px">' +
    '<div class="girador"></div>Preguntándole a Google Maps por ' +
    escapar(comuna) + '…</div>';

  google.script.run
    .withSuccessHandler(function (r) {
      if (!r.ok) {
        caja.innerHTML = '<div class="alerta aviso">' + escapar(r.mensaje) + '</div>';
        return;
      }
      ASISTENTE_ULTIMO = r;
      var avisos = (r.advertencias || []).length
        ? '<div class="alerta aviso" style="margin-top:14px">' +
          '<span class="id">LO QUE ESTE NUMERO NO INCLUYE</span>' +
          r.advertencias.map(escapar).join('<br>') + '</div>'
        : '';
      var origen = r.origenDato
        ? '<p class="chico" style="margin-bottom:12px">' + escapar(r.origenDato) + '</p>'
        : '';
      caja.innerHTML = origen + dibujarAsistente(r) + avisos;
    })
    .withFailureHandler(function (e) {
      caja.innerHTML = '<div class="alerta error">' + escapar(e.message) + '</div>';
    })
    .cotizarComuna(TOKEN, { comuna: comuna, region: region, equipos: equipos });
}

function dibujarRutas() {
  var filas = DATOS.resultado.tramos

      var c = t.comparacionRuta;

        '<td class="num">' + pesos(t.costos.peajes) + '</td>' +
        '<td><span class="pastilla ' +
          (t.rutaElegida === 'Por autopista' ? 'neutra' : 'ok') + '">' +
          escapar(t.rutaElegida) + '</span></td>' +

}

          '<h2>' + escapar(o.tecnico.nombre) + '</h2>' +
          '<p class="ayuda" style="margin-top:-6px">Técnico ' + o.tecnico.codigo + '</p>' +
          '<p class="ayuda">Licencia de conducir: <b>' + o.tecnico.licencia + '</b></p>' +
          '<div class="rejilla rejilla-4">' +
            '<div class="kpi"><div class="etiqueta">Monto a transferir</div>' +
              '<div class="valor acento">' + pesos(tr.total) + '</div>' +
              '<div class="pie">viatico ' + pesos(tr.viatico) + ' · hotel ' +
                pesos(tr.hotel) + '</div></div>' +
            '<div class="kpi"><div class="etiqueta">Dias desplegado</div>' +
              '<div class="valor">' + (re.dias || 0) + '</div>' +
              '<div class="pie">' + (re.noches || 0) + ' noches fuera</div></div>' +
            '<div class="kpi"><div class="etiqueta">Horas asignadas</div>' +
              '<div class="valor">' + numero(re.horas, 1) + '</div>' +
              '<div class="pie">' + numero(re.horasEnSitio, 1) + ' h en sitio</div></div>' +
            '<div class="kpi"><div class="etiqueta">Localidades</div>' +
              '<div class="valor">' + (re.nLocalidades || 0) + '</div>' +
              '<div class="pie">' + numero(re.equipos, 1) + ' equipos</div></div>' +
          '</div></div>' +

        '<div class="tarjeta"><h2>Hoja de ruta</h2>' +
          '<div class="tabla-envoltorio"><table class="datos">' +
          '<tr><th>Dia</th><th>Cuadrilla</th><th>Tramo y direccion</th>' +
          '<th class="c">Equipos</th><th class="num">Tiempo</th><th>Pernocta</th></tr>' +
          (tramos || '<tr><td colspan="6">Técnico en reserva: sin tramos asignados en este plan.</td></tr>') + '</table></div></div>' +

        '<div class="tarjeta"><h2>Direcciones y material de la visita</h2>' +
          o.tramos.filter(function (t) { return t.equipos > 0; }).map(function (t) {
            var url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t.direccion);
            return '<p><b>' + escapar(t.hasta) + '</b> · <a href="' + escapar(url) + '" target="_blank" rel="noopener">Abrir dirección</a>' +
              (/^https:\/\//i.test(t.linkCapacitacion) ? ' · <a href="' + escapar(t.linkCapacitacion) + '" target="_blank" rel="noopener">Material de capacitación</a>' : ' · Material por confirmar') + '</p>';
          }).join('') + '</div>' +

        (o.capacitacionDigital
          ? '<div class="alerta aviso"><span class="id">ANTES DE SALIR</span>' +
            'Confirme que al cliente se le envio el correo con el enlace de Drive de la ' +
            'capacitacion. La visita presencial esta planificada corta justamente porque ' +
            'el cliente ya vio el material.</div>'
          : '') +

        '<div class="tarjeta"><h2>Implementos y materiales</h2><p class="ayuda">Verificación en esta pantalla. Las marcas se reinician al volver a cargar la orden.</p>' +
          o.checklist.map(function (c, i) {
            return '<label class="checklist-item"><input type="checkbox" id="chk' + i + '">' +
              '<span>' + escapar(c.item) + '</span></label>';
          }).join('') + '</div>';
    })
    .withFailureHandler(function (e) {
      caja.innerHTML = '<div class="alerta error">' + escapar(e.message) + '</div>';
    })
    .obtenerOrdenServicio(TOKEN, codigo, DATOS.escenarioActivo);
}

function exportarPdf() {
  var codigo = document.getElementById('selectorOrden').value;
  google.script.run
    .withSuccessHandler(function (r) {
      alert('PDF creado en Drive:\n\n' + r.nombre + '\n\n' + r.url);
    })
    .withFailureHandler(function (e) { alert('Error: ' + e.message); })
    .exportarOrdenDesdeApi(TOKEN, codigo, DATOS.escenarioActivo);
}

/* ==========================================================================
   SELECTORES
   ========================================================================== */

function llenarSelectores() {
  var llenar = function (id, items, valor, texto, seleccionado) {
    var sel = document.getElementById(id);
    if (!sel) return;
    seleccionado = seleccionado || sel.value;
    sel.innerHTML = items.map(function (x) {
      return '<option value="' + escapar(x[valor]) + '">' + escapar(x[texto]) + '</option>';
    }).join('');
    if (seleccionado) sel.value = seleccionado;
  };

  var tecnicos = DATOS.tecnicos.map(function (t) {
    return { codigo: t.codigo, etiqueta: t.nombre + ' · ' + t.codigo };
  });
  llenar('selectorFicha', tecnicos, 'codigo', 'etiqueta');
  llenar('selectorOrden', tecnicos, 'codigo', 'etiqueta', TECNICO_INICIAL);

  var locs = DATOS.destinos
    .filter(function (d) { return d.localidad !== 'BASE'; })
    .map(function (d) { return { codigo: d.localidad, etiqueta: d.localidad }; });
  llenar('simLocalidad', locs, 'codigo', 'etiqueta');

  var dias = [];
  for (var i = 1; i <= DATOS.resultado.parametros.P_HORIZONTE_MAX_DIAS; i++) {
    dias.push({ codigo: 'D' + i, etiqueta: 'Día ' + i });
  }
  llenar('simDia', dias, 'codigo', 'etiqueta');

  dibujarFicha();
  TECNICO_INICIAL = '';
  dibujarOperacion();
}

/* ==========================================================================
   GRAFICOS
   ========================================================================== */

function dibujarGraficos() {
  if (!GRAFICOS_LISTOS || !DATOS) return;
  var R = DATOS.resultado, T = R.totales;

  var opciones = function (extra) {
    var base = {
      backgroundColor: 'transparent',
      chartArea: { width: '72%', height: '76%' },
      legend: { position: 'none' },
      fontName: 'Arial', fontSize: 11,
      colors: ['#1F3864'],
      hAxis: { textStyle: { fontSize: 10 } },
      vAxis: { textStyle: { fontSize: 10 } }
    };
    for (var k in extra) base[k] = extra[k];
    return base;
  };

  var pintar = function (id, tipo, datos, opts) {
    var el = document.getElementById(id);
    if (!el || !el.offsetParent) return;   // no dibujar en pestanas ocultas
    new google.visualization[tipo](el).draw(google.visualization.arrayToDataTable(datos), opts);
  };

  // Gasto por localidad
  var locs = R.localidades.slice(0, 16);
  pintar('graficoGastoLocalidad', 'BarChart',
    [['Localidad', 'Gasto']].concat(locs.map(function (L) { return [L.localidad, L.total]; })),
    opciones({ colors: ['#C00000'], hAxis: { format: 'short' } }));

  // Equipos por localidad
  pintar('graficoEquipos', 'BarChart',
    [['Localidad', 'Equipos']].concat(
      locs.map(function (L) { return [L.localidad, L.equipos]; })),
    opciones({}));

  // Composicion del gasto
  var cats = [
    ['Combustible', T.combustible], ['Peajes', T.peajes], ['Desgaste', T.desgaste],
    ['Pasajes', T.pasajes], ['Hotel', T.hotel], ['Viatico', T.viatico],
    ['Sobretiempo', T.sobretiempo], ['Imprevistos', T.imprevistos]
  ].filter(function (c) { return c[1] > 0; });
  pintar('graficoComposicion', 'PieChart', [['Categoria', 'Monto']].concat(cats),
    opciones({ legend: { position: 'right', textStyle: { fontSize: 11 } },
               pieHole: 0.42,
               colors: ['#1F3864', '#2E5C9A', '#5B8DD6', '#8FB3E8',
                        '#C00000', '#E8A33D', '#7A1212', '#F2CC8F'] }));

  // Gasto por dia
  var porDia = {};
  R.tramos.forEach(function (t) {
    porDia[t.dia] = (porDia[t.dia] || 0) + t.subtotal;
  });
  var dias = Object.keys(porDia).sort(function (a, b) {
    return Number(a.substring(1)) - Number(b.substring(1)); });
  pintar('graficoGastoDia', 'ColumnChart',
    [['Día', 'Gasto']].concat(dias.map(function (d) { return [fmtD(d), porDia[d]]; })),
    opciones({ colors: ['#2E5C9A'] }));

  // Horas en sitio contra traslado
  pintar('graficoHoras', 'BarChart',
    [['Tecnico', 'En sitio', 'En traslado']].concat(
      R.porTecnico.map(function (t) {
        return [nomT(t.tecnico), t.horasEnSitio, t.horasViaje]; })),
    opciones({ isStacked: true, legend: { position: 'top' },
               colors: ['#2E7D32', '#E8A33D'] }));
}

window.addEventListener('resize', function () {
  clearTimeout(window._redibujar);
  window._redibujar = setTimeout(dibujarGraficos, 250);
});

/* ==========================================================================

   ========================================================================== */
function confirmarRestauracion() {
  if (!confirm('⚠️ ALERTA ⚠️\n\n¿Estás seguro de que deseas regenerar la estructura base en tu Excel? Esto borrará configuraciones erróneas, pero podrías perder datos personalizados.')) return;
  
  document.getElementById('textoCargando').innerText = 'Restaurando estructura en Google Sheets...';
  document.getElementById('cargando').style.display = 'flex';
  
  google.script.run
    .withSuccessHandler(function (r) {
      if (r.ok) {
        alert(r.mensaje);
        location.reload();
      } else {
        alert('Error: ' + r.mensaje);
        document.getElementById('cargando').style.display = 'none';
      }
    })
    .withFailureHandler(function (e) {
      alert('Error en red: ' + e.message);
      document.getElementById('cargando').style.display = 'none';
    })
    .apiRestaurarHojas(TOKEN);
}
